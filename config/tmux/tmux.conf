# Use zsh as default
set -g default-shell /bin/zsh

# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "tmux-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals
# Ghostty: exact colours, clickable links, undercurl and flicker-free redraws for nvim and Claude Code
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle:strikethrough:sync"

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g status-position bottom

# Set prefix key
unbind C-b              # Unbind the default prefix key
set -g prefix C-Space   # Set new prefix key to Ctrl+Space

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split horizontally in CWD with \
unbind %
bind \\ split-window -h -c "#{pane_current_path}"

# Split vertically in CWD with -
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed
# Claude Code's binary is named after its version; show "claude" instead of e.g. 2.1.296
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'

# Sessions per repo / git worktree (~/.local/bin/tms)
set -g focus-events on # Lets nvim reload files that Claude edits
bind f display-popup -E -w 85% -h 75% -e TMS_POPUP=1 "~/.local/bin/tms"                                 # Any repo or worktree
bind g display-popup -E -w 85% -h 75% -e TMS_POPUP=1 -d "#{pane_current_path}" "~/.local/bin/tms wt"    # Worktrees of this repo
bind G display-popup -E -w 60% -h 30% -e TMS_POPUP=1 -d "#{pane_current_path}" "~/.local/bin/tms new"   # New worktree
bind X display-popup -E -w 85% -h 75% -e TMS_POPUP=1 -d "#{pane_current_path}" "~/.local/bin/tms rm"    # Remove a worktree
bind a run-shell "~/.local/bin/tms window claude '#{session_id}' '#{session_path}'"                     # Jump to Claude
bind e run-shell "~/.local/bin/tms window edit '#{session_id}' '#{session_path}'"                       # Jump to nvim
bind Tab switch-client -l                                                                               # Previous session
bind b run-shell "~/.local/bin/tms dock '#{session_id}' '#{session_path}'"                              # Claude beside the editor, or back to its own window

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Load Gruvbox theme
run-shell "~/.config/tmux/themes/gruvbox/theme.tmux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
